name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Accept Android licenses
      run: |
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        yes | sdkmanager --licenses || true
        # Oppure forza l'accettazione tramite Flutter
        which flutter || echo "Flutter non ancora nel PATH della build"
        # Se Flutter viene scaricato al volo da Flet, forziamo l'invio della y
        printf 'y\ny\ny\ny\ny\ny\ny\n' | flutter doctor --android-licenses || true

    - name: Build APK with Flet
      run: |
        echo "y" | flet build apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: cftc-apk
        path: |
          build/apk/*.apk
          build/**/outputs/apk/**/*.apk
