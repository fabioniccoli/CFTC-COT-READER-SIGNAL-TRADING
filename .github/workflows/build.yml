name: Build Android APK (Offuscato)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clona Repository
      uses: actions/checkout@v4

    - name: 🐍 Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Installa Dipendenze & Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet requests

    - name: 🔒 Esegui Offuscamento del Codice AST
      run: |
        python obfuscate.py main.py main_protected.py
        # Sostituiamo temporaneamente il file main principale con quello protetto per Flet Build
        cp main_protected.py main.py

    - name: 🏗️ Compila Pacchetto Android con Flet
      run: |
        flet build apk --project-name "CFTC COT Analyzer"

    - name: 🚀 Carica APK negli Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cftc-cot-analyzer-apk
        path: build/apk/*.apk
