name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet==0.24.1 requests
        # Se preferisci usare il requirements.txt, assicurati che contenga flet==0.24.1

    - name: Build APK with Flet
      run: |
        echo "y" | flet build apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: cftc-apk
        path: |
          build/apk/*.apk
          build/**/outputs/apk/**/*.apk
