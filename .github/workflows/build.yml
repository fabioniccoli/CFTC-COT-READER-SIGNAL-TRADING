name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Flet and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build APK with Flet Action
      uses: flet-dev/build-app-action@v1
      with:
        target: 'main.py' # Assicurati che sia il nome del tuo file principale Python (es. main.py o app.py)
        platform: 'apk'

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: cftc-apk
        path: |
          build/apk/*.apk
          build/**/outputs/apk/**/*.apk
