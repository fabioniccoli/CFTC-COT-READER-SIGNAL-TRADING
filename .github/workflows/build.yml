name: Build Android APK (Offuscato)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clona Repository
      uses: actions/checkout@v4

    - name: 🐍 Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ☕ Configura Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📦 Installa la versione esatta dal progetto (Flet 0.28.3)
      run: |
        python -m pip install --upgrade pip
        pip install flet==0.28.3 requests
        pip install -r requirements.txt

    - name: 🔒 Esegui Offuscamento del Codice AST
      run: |
        python obfuscate.py main.py main_protected.py
        # Sostituiamo il file principale con quello protetto prima della build
        cp main_protected.py main.py

    - name: 🏗️ Compila Pacchetto Android con Flet
      run: |
        # Senza argomenti non riconosciuti, legge tutto da flet.yml
        flet build apk

    - name: 🚀 Carica APK negli Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cftc-cot-analyzer-apk
        path: build/apk/*.apk
